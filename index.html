<!DOCTYPE html>
<!-- ==========================================================
     VERSION 3 (STABLE) — TikTok / Reels Vertical Video Feed
     ========================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Popular Live Videos</title>
  <meta name="description" content="Watch Popular Live Videos with interactive sponsor unlock mechanics.">

  <!-- Favicon / Theme -->
  <meta name="theme-color" content="#07090e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

  <!-- Modern Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase v10 Compat CDN (Firestore for real-time DB, no billing required) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="app">
    <!-- 1. Top Modern Brand Header (Popular Live Videos + Subtle LIVE Badge) -->
    <header class="top-brand-header" aria-label="Brand Header">
      <div class="brand-badge-pill">
        <span class="live-pulse-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
      <h1 class="brand-title">Popular Live Videos</h1>
    </header>

    <!-- 2. Dynamic Banner Ad Container (Strictly conditional; rendered only when custom ad content exists) -->
    <div class="top-banner-wrapper" id="top-banner-container" aria-label="Sponsored Banner" style="display: none;">
      <div class="banner-inner" id="top-banner-inner">
        <!-- Dynamically rendered banner advertisement -->
      </div>
    </div>

    <!-- 2. Floating Quick Controls (Sound & Admin Access) -->
    <aside class="top-controls" aria-label="Controls">
      <!-- Mute / Unmute Button -->
      <button class="icon-btn-blur" id="sound-toggle-btn" title="Toggle Sound" aria-label="Toggle Sound">
        <svg id="sound-icon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <!-- Admin Panel Secret Shortcut (Hidden by default from regular visitors) -->
      <a href="admin.html" id="admin-shortcut-btn" class="icon-btn-blur" title="Admin Dashboard" aria-label="Open Admin Dashboard" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </a>
    </aside>

    <!-- 3. Floating Middle Up/Down Video Navigation Arrows -->
    <nav class="feed-nav-arrows" aria-label="Video Navigation">
      <button class="nav-arrow-btn nav-arrow-up" id="nav-arrow-up" title="Previous Video" aria-label="Previous Video">
        <svg viewBox="0 0 24 24">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
      <button class="nav-arrow-btn nav-arrow-down" id="nav-arrow-down" title="Next Video" aria-label="Next Video">
        <svg viewBox="0 0 24 24">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </nav>

    <!-- 4. Vertical Snap-Scroll Feed Container -->
    <main class="feed-container" id="feed-container" role="feed" aria-busy="true">
      <!-- Video cards dynamically rendered by script.js -->
    </main>
  </div>

  <!-- Centralized Firebase & Data Service -->
  <script src="firebase-config.js"></script>

  <!-- Feed Logic & Video Interaction -->
  <script src="script.js"></script>
</body>
</html>
